# Sources Configuration
# ATS endpoints and public job feed sources

crawler:
  user_agent: "JobCrawler/1.0 (+https://github.com/mayur/job-crawler; dev career tracker)"
  request_timeout_seconds: 15
  rate_limit_delay_seconds: 0.5

sources:
  greenhouse:
    enabled: true
    # Public boards-api.greenhouse.io slugs
    companies:
      # Top tech with India engineering & remote roles
      - slug: gitlab
        name: "GitLab"
      - slug: stripe
        name: "Stripe"
      - slug: cloudflare
        name: "Cloudflare"
      - slug: airbnb
        name: "Airbnb"
      - slug: reddit
        name: "Reddit"
      - slug: coinbase
        name: "Coinbase"
      - slug: robinhood
        name: "Robinhood"
      # Major tech hubs in India (Bengaluru, Pune, Hyderabad, Gurgaon)
      - slug: twilio
        name: "Twilio"
      - slug: rubrik
        name: "Rubrik"
      - slug: thoughtworks
        name: "Thoughtworks"
      - slug: inmobi
        name: "InMobi"
      - slug: hackerrank
        name: "HackerRank"
      - slug: slice
        name: "Slice"
      - slug: groww
        name: "Groww"

  lever:
    enabled: true
    # Public api.lever.co/v0/postings slugs
    companies:
      - slug: spotify
        name: "Spotify"
      - slug: palantir
        name: "Palantir"
      - slug: kinsta
        name: "Kinsta"

  remoteok:
    enabled: true
    # RemoteOK public feed
    tags:
      - "backend"
      - "golang"
      - "python"
      - "full-stack"
